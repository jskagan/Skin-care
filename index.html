<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one narrow column app. Header with person switch, tab bar, then Today / Routine / Masks / Product usage. */
:root {
  --bg: #EFF3F1;
  --surface: #FFFFFF;
  --fg: #13201B;
  --muted: #5B6B65;
  --line: #D5DEDA;
  --accent: #1D6B58;
  --accent-fg: #FFFFFF;
  --am: #A85F00;
  --am-bg: #FBEBCF;
  --pm: #3C3F94;
  --pm-bg: #E3E4F7;
  --mask: #8A3A7A;
  --mask-bg: #F3E2EF;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --scrim: rgba(8, 14, 12, 0.9);
  --scrim-fg: #F2F7F4;
  --ok-fg: #1E7A3C; --ok-bg: #D9F2E0;
  --bad-fg: #B3261E; --bad-bg: #F9DEDC;
  --na: #E6EAE8; --today-bg: #F4F8F6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512; --surface: #16201B; --fg: #E7EFEB; --muted: #96A8A0; --line: #26342E;
    --accent: #5CC3A5; --accent-fg: #0E1512;
    --am: #F0B455; --am-bg: #3A2B10; --pm: #A9ADF5; --pm-bg: #23254A;
    --mask: #E49BD0; --mask-bg: #3A1F35;
    --ok-fg: #7ADB9A; --ok-bg: #163A24;
    --bad-fg: #F4A09A; --bad-bg: #4A1F1C;
    --na: #202A25; --today-bg: #1B2520;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512; --surface: #16201B; --fg: #E7EFEB; --muted: #96A8A0; --line: #26342E;
  --accent: #5CC3A5; --accent-fg: #0E1512;
  --am: #F0B455; --am-bg: #3A2B10; --pm: #A9ADF5; --pm-bg: #23254A;
  --mask: #E49BD0; --mask-bg: #3A1F35;
  --ok-fg: #7ADB9A; --ok-bg: #163A24;
  --bad-fg: #F4A09A; --bad-bg: #4A1F1C;
  --na: #202A25; --today-bg: #1B2520;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mark { width: 3rem; height: 3rem; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); flex: none; }
.who { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; align-self: flex-start; }
.who button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.who button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: none; white-space: nowrap; border: 0; background: none; padding: 8px 0 10px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }

.session { display: flex; gap: 8px; }
.session button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.session button[data-s="am"][aria-pressed="true"] { background: var(--am-bg); border-color: var(--am); color: var(--am); }
.session button[data-s="pm"][aria-pressed="true"] { background: var(--pm-bg); border-color: var(--pm); color: var(--pm); }
.session svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.banner { background: var(--mask-bg); border: 1px solid var(--mask); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.banner .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.banner .label { color: var(--mask); }
.banner strong { font-family: var(--font-display); font-size: 1.2rem; }
.banner.quiet { background: var(--surface); border-color: var(--line); }
.banner.quiet .label { color: var(--muted); }
.notice { background: var(--surface); border: 1px dashed var(--muted); border-radius: 12px; padding: 10px 14px; font-size: 0.875rem; color: var(--muted); }

.progress { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.pc { display: flex; flex-direction: column; gap: 6px; }
.step { flex: 1; min-width: 0; display: grid; grid-template-columns: 1.5rem minmax(0, 1fr) 1.75rem; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.step .n { font-family: var(--font-mono); font-weight: 500; font-size: 1.25rem; color: var(--muted); }
.step .name { font-weight: 600; display: block; }
.step .brand { font-size: 0.8125rem; color: var(--muted); display: block; }
.step .box { width: 1.5rem; height: 1.5rem; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; }
.step .box svg { width: 14px; height: 14px; stroke: var(--accent-fg); stroke-width: 3; fill: none; opacity: 0; }
.step[aria-pressed="true"] { background: transparent; }
.step[aria-pressed="true"] .name { text-decoration: line-through; color: var(--muted); }
.step[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.step[aria-pressed="true"] .box svg { opacity: 1; }
.step.out .name { color: var(--muted); }
div.step { cursor: default; }
.note { font-size: 0.875rem; color: var(--muted); margin: 0; }

.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding-left: calc(3.5rem + 8px); font-size: 0.8125rem; color: var(--muted); }
.meta .acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mini { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 12px; font-size: 0.8125rem; font-weight: 600; }
.mini.warn { border-color: var(--mask); color: var(--mask); }
.mini:disabled { opacity: 0.45; cursor: default; }
.tag { color: var(--mask); font-weight: 600; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col h2 { display: flex; align-items: center; gap: 8px; }
.col.am h2 { color: var(--am); } .col.pm h2 { color: var(--pm); }
ol.plain .step { grid-template-columns: 1.5rem minmax(0, 1fr); }

.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.list li.today { border-color: var(--mask); background: var(--mask-bg); }
.list .d { font-family: var(--font-mono); font-size: 0.875rem; }
.list .rel { font-size: 0.8125rem; color: var(--muted); }

.months { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.month { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.grid .h { text-align: center; font-size: 0.6875rem; color: var(--muted); font-weight: 600; }
.grid .c { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); }
.grid .c.m { background: var(--mask); color: var(--bg); font-weight: 500; }
.grid .c.t { outline: 2px solid var(--fg); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.875rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { display: inline-grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 6px; background: var(--mask); color: var(--bg); font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500; }

.ucard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.day.today { border-color: var(--accent); }
.day h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.day h2 .rel { font-family: var(--font-body); font-weight: 500; font-size: 0.8125rem; color: var(--muted); }
.ppl { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pp { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pp strong { font-size: 0.9375rem; }
.sess { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 0.875rem; }
.sess .k { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.sess .k svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sess.am .k { color: var(--am); } .sess.pm .k { color: var(--pm); }
.sess .cnt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sess .names { color: var(--muted); }
.sess .none { color: var(--muted); font-style: italic; }
.mk { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--mask); font-weight: 600; }
.tscroll { overflow-x: auto; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table.log { border-collapse: separate; border-spacing: 0; font-size: 0.8125rem; min-width: 100%; }
table.log th, table.log td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; text-align: center; vertical-align: middle; }
table.log th { font-weight: 600; color: var(--muted); background: var(--surface); }
table.log th.date { padding: 0; line-height: 1.2; white-space: nowrap; color: var(--fg); }
table.log .dl { border: 0; background: none; color: inherit; font: inherit; font-weight: inherit; padding: 8px 6px 2px; width: 100%; border-radius: 8px; }
table.log th.s .dl { padding: 2px 0 6px; font-size: inherit; letter-spacing: inherit; }
table.log .dl:hover { background: var(--today-bg); }
table.log .dl:focus-visible { outline-offset: -3px; }
table.log th.date.mask { color: var(--mask); }
table.log th.s { font-size: 0.6875rem; letter-spacing: 0.06em; padding: 0; width: 2.4rem; min-width: 2.4rem; }
table.log th.s.am { color: var(--am); } table.log th.s.pm { color: var(--pm); }
table.log th.prod { position: sticky; left: 0; z-index: 1; text-align: left; padding: 8px 12px; white-space: nowrap; color: var(--fg); background: var(--surface); box-shadow: 1px 0 0 var(--line); }
table.log thead th.prod { font-family: var(--font-display); font-size: 1.05rem; vertical-align: bottom; }
table.log td { height: 2.4rem; }
table.log td span { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 6px; }
table.log td svg, .legend .sw svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
table.log td.yes span, .sw.yes { color: var(--ok-fg); background: var(--ok-bg); }
table.log td.no span, .sw.no { color: var(--bad-fg); background: var(--bad-bg); }
table.log td.na, .sw.na { background: var(--na); }
table.log .today { background-color: var(--today-bg); }
table.log th.prod.today { background: var(--surface); }
.legend .sw { display: inline-grid; place-items: center; width: 1.3rem; height: 1.3rem; border-radius: 5px; border: 1px solid var(--line); }
.legend .sw.mk { background: var(--mask-bg); border-color: var(--mask); }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 0.9375rem; }
.field input[type="date"], .field input[type="text"], .addrow input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; width: 100%; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg label { padding: 8px 12px; font-weight: 600; font-size: 0.875rem; color: var(--muted); cursor: pointer; }
.seg input { position: absolute; opacity: 0; width: 0; height: 0; }
.seg input:checked + label { background: var(--accent); color: var(--accent-fg); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: -3px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.err { color: var(--bad-fg); font-size: 0.875rem; margin: 0; }
.trips { display: flex; flex-direction: column; gap: 8px; }
.tripcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tripcard strong { display: block; }
.pl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pl li.grp { display: block; background: none; border: 0; padding: 8px 4px 0; }
.pl li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px 4px 4px; }
.pl .item { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 10px; }
.pl .item .box { width: 1.5rem; height: 1.5rem; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; }
.pl .item .box svg { width: 14px; height: 14px; stroke: var(--accent-fg); stroke-width: 3; fill: none; opacity: 0; }
.pl .item[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.pl .item[aria-pressed="true"] .box svg { opacity: 1; }
.pl .item[aria-pressed="true"] .nm { text-decoration: line-through; color: var(--muted); }
.pl .nm { font-weight: 600; display: block; }
.pl .qt { font-size: 0.8125rem; color: var(--muted); display: block; }
.x { border: 0; background: none; color: var(--muted); width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; }
.x svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.danger { border-color: var(--bad-fg); color: var(--bad-fg); }
.facebtn { border: 0; padding: 0; background: none; position: relative; display: block; width: min(100%, calc(100vh - 17rem)); max-width: 100%; border-radius: 24px; overflow: hidden; }
.facebtn .doneicon { width: 100%; }
.maskov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.note.center { text-align: center; }
.banner.done { border-color: var(--ok-fg); background: var(--ok-bg); }
.banner .maskcheck { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; border: 1px solid var(--mask); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 8px 12px; font-weight: 600; }
.banner .maskcheck .box { width: 1.5rem; height: 1.5rem; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; }
.banner .maskcheck .box svg { width: 14px; height: 14px; stroke: var(--accent-fg); stroke-width: 3; fill: none; opacity: 0; }
.banner .maskcheck[aria-pressed="true"] { border-color: var(--ok-fg); color: var(--muted); }
.banner .maskcheck[aria-pressed="true"] .box { background: var(--ok-fg); border-color: var(--ok-fg); }
.banner .maskcheck[aria-pressed="true"] .box svg { opacity: 1; }
.banner .maskcheck:disabled { opacity: 0.5; }
.banner.remind { background: var(--mask-bg); border-color: var(--mask); }
.datepick { position: relative; display: block; }
.datebtn { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; color: inherit; display: inline-flex; align-items: baseline; gap: 10px; text-align: left; border-radius: 8px; }
.datebtn svg { width: 0.7em; height: 0.7em; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; align-self: center; }
#daypick { position: absolute; left: 0; bottom: 0; width: 100%; height: 1px; opacity: 0; border: 0; padding: 0; pointer-events: none; }
.complete { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 1.0625rem; background: var(--ok-fg); color: #FFFFFF; }
.complete svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.complete:disabled { opacity: 0.5; cursor: default; }
.donewrap { display: flex; justify-content: center; }
.doneicon { display: block; width: min(100%, calc(100vh - 17rem)); max-width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 24px; }
.btnrow.center { justify-content: center; }

.gate { display: flex; justify-content: center; padding-top: 10vh; }
.gatecard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.gateicon { width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--line); }
footer { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.account { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.members summary { cursor: pointer; font-weight: 600; font-size: 0.9375rem; }
.members ul.plain { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.members ul.plain li { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; font-size: 0.9375rem; }
.members .addrow { margin-top: 6px; }
.field input[type="email"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; width: 100%; }
.uhead { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.uhead .thumb { width: 3rem; height: 3.75rem; }
.uhead strong { display: block; }

<body>
<div id="gate" class="gate"></div>
<div class="wrap" id="wrap" hidden>
  <header>
    <div class="top"><div class="who" role="group" aria-label="Whose routine">
      <button id="p-jonathan" data-person="jonathan" aria-pressed="true">Jonathan</button>
      <button id="p-wife" data-person="wife" aria-pressed="false">Monique</button>
    </div><img class="mark" src="img/app-icon.jpg" alt=""></div>
    <div class="tabs" role="tablist">
      <button id="t-today" role="tab" data-view="today" aria-selected="true">Today</button>
      <button id="t-routine" role="tab" data-view="routine" aria-selected="false">Routine</button>
      <button id="t-masks" role="tab" data-view="masks" aria-selected="false">Masks</button>
      <button id="t-usage" role="tab" data-view="usage" aria-selected="false">Product usage</button>
      <button id="t-log" role="tab" data-view="log" aria-selected="false">Daily log</button>
      <button id="t-trip" role="tab" data-view="trip" aria-selected="false">Trip planning</button>
    </div>
  </header>
  <main id="app"></main>
  <footer id="acct"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// Translucent sheet mask drawn over the face in the app icon (coordinates are % of the square image).
var MASK_OVERLAY = '<svg class="maskov" viewBox="0 0 100 100" aria-hidden="true">' +
  '<path fill="#FFFFFF" fill-opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="0.6" fill-rule="evenodd" d="M25 59.5 a26 26.5 0 1 0 52 0 a26 26.5 0 1 0 -52 0 Z M29.5 47.5 a8.5 4.6 0 1 0 17.0 0 a8.5 4.6 0 1 0 -17.0 0 Z M55.5 47.5 a8.5 4.6 0 1 0 17.0 0 a8.5 4.6 0 1 0 -17.0 0 Z M44 64 a7 3.8 0 1 0 14 0 a7 3.8 0 1 0 -14 0 Z M40 72.5 a10 4.2 0 1 0 20 0 a10 4.2 0 1 0 -20 0 Z"/>' +
  '</svg>';
var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';

// ---- Data: edit here to change products, order, or the mask rotation ----
// Every product counts as new on this date. Jonathan and Monique each have their own bottles and their own counts.
var SEED = "2026-11-03";

function P(id, name, brand, img, sessions) {
  return { id: id, name: name, brand: brand, img: img, sessions: sessions || ["am", "pm"] };
}
var SHARED = [
  P("cleanser", "Water Foam Cleanser", "Dermalance", "img/dermalance-cleanser.jpg"),
  P("spray", "H2P Spray", "H2P", "img/h2p-spray.jpg"),
  P("eye", "Eylain eye solution", "Vrelain", "img/eylain-him-3.jpg"),
  P("toner", "Black Awakening Fluid (toner)", "Evercell", "img/evercell-toner.jpg"),
  P("serum", "Black Activating Serum", "Evercell", "img/evercell-serum.jpg")
];
var DAY_CREAM = P("daycream", "Day Cream (Black Vitalizing Cream)", "Evercell", "img/evercell-day-cream.jpg", ["am"]);
var SUNSCREEN = P("sunscreen", "Sunscreen", "", null, ["am"]);
var NIGHT_CREAM = P("nightcream", "Night Cream (PDRN)", "Pyderin", "img/pyderin-night-cream.jpg", ["pm"]);

var HER_SHARED = [
  P("foam", "Purifying Cleansing Foam", "oera", "img/oera-foam.jpg"),
  P("spray", "H2P Spray", "H2P", "img/h2p-spray.jpg"),
  P("toner", "PDRN Lift Toner", "Pyderin", "img/pyderin-toner.jpg"),
  P("eye", "Eylain eye solution", "Vrelain", "img/eylain-her-4.jpg"),
  P("lotion", "Hydralift Essence-in-Lotion", "oera", "img/oera-lotion.jpg")
];
var HER_DAY = P("daycream", "Day Cream (Calibrating Care)", "oera", "img/oera-day-cream.jpg", ["am"]);
var HER_NIGHT = P("nightcream", "Night Cream (PDRN Lift)", "Pyderin", "img/pyderin-night-cream.jpg", ["pm"]);

var PEOPLE = {
  jonathan: { name: "Jonathan", labeled: true, am: SHARED.concat([DAY_CREAM, SUNSCREEN]), pm: SHARED.concat([NIGHT_CREAM]) },
  wife: { name: "Monique", labeled: false, am: HER_SHARED.concat([HER_DAY, SUNSCREEN]), pm: HER_SHARED.concat([HER_NIGHT]) }
};

// Masks: first one on START, then one every 3 days, cycling in this order.
var MASKS = [
  { name: "Metabolic mask pack", brand: "H2P", short: "M", img: "img/mask-metabolic.jpg" },
  { name: "Vacation Refresh Mask", brand: "Clabiane", short: "V", img: "img/mask-clabiane.jpg", alt: { name: "Dermabotul Super Slim Facial Mask", brand: "BoLC", img: "img/dermabotul-mask.jpg" } },
  { name: "PDRN Mask (Face)", brand: "Pyderin", short: "P", img: "img/mask-pyderin.jpg" }
];
var START = Date.UTC(2026, 10, 9);
var EVERY = 3;
var DAY = 86400000;

// ---- Date helpers ----
function pad(n) { return (n < 10 ? "0" : "") + n; }
function nowParts() {
  var d = new Date();
  return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate(), h: d.getHours(), utc: Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) };
}
function todayKey() { var t = nowParts(); return t.y + "-" + pad(t.m + 1) + "-" + pad(t.d); }
// The day shown on the Today tab: today unless a date was picked from the Daily log.
function viewKey() { return state.date || todayKey(); }
function toUtc(key) { var p = key.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function toKey(utc) { var d = new Date(utc); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
function daysBetween(a, b) { return Math.round((toUtc(b) - toUtc(a)) / DAY); }
function fmt(utc, opts) { return new Date(utc).toLocaleDateString("en-US", Object.assign({ timeZone: "UTC" }, opts)); }
function fmtKey(key) { return fmt(toUtc(key), { month: "short", day: "numeric" }); }
function maskFor(utc) {
  var n = Math.round((utc - START) / DAY);
  if (n < 0 || n % EVERY !== 0) return null;
  return MASKS[(n / EVERY) % MASKS.length];
}
function nextMask(utc) {
  var n = Math.round((utc - START) / DAY);
  n = n <= 0 ? 0 : Math.ceil(n / EVERY) * EVERY;
  return { utc: START + n * DAY, mask: MASKS[(n / EVERY) % MASKS.length] };
}
function rel(utc, today) {
  var n = Math.round((utc - today) / DAY);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  return "In " + n + " days";
}

// ---- State ----
var state = { date: null, person: "jonathan", view: "today", session: (nowParts().h >= 3 && nowParts().h < 14) ? "am" : "pm", confirm: null };
var DB = null;
var dbState = "loading";  // loading | ready | offline | slow
var canWrite = true;
var checks = {};          // checks/<person>_<date>_<session> -> { person, date, session, steps: [productId] }
var bottles = {};         // bottles/<person>_<productId> -> { person, pid, startedOn, status, emptiedOn?, cycles: [] }
var idx = {};             // "<person>|<pid>" -> [dates checked off]
var queues = {};
var trips = {};           // trips/<id> -> { id, person, leave, leaveAt, ret, retAt, items: [...], createdOn }
var tripUi = { mode: "list", id: null, err: "", msg: "" };

function canAct() { return canWrite && (dbState === "ready" || dbState === "offline"); }

function reindex() {
  idx = {};
  Object.keys(checks).forEach(function (id) {
    var d = checks[id];
    if (!d || !d.steps) return;
    d.steps.forEach(function (pid) { (idx[d.person + "|" + pid] = idx[d.person + "|" + pid] || []).push(d.date); });
  });
}
function getBottle(person, pid) {
  var b = bottles[person + "_" + pid];
  if (b) return b;
  return { person: person, pid: pid, startedOn: SEED, status: "active", cycles: [] };
}
function usesOf(person, pid) {
  var b = getBottle(person, pid), dates = idx[person + "|" + pid] || [], n = 0;
  dates.forEach(function (d) {
    if (d >= b.startedOn && (b.status !== "empty" || d <= b.emptiedOn)) n++;
  });
  return n;
}
function save(path, data) {
  if (!DB) return;
  var prev = queues[path] || Promise.resolve();
  queues[path] = prev.then(function () { return DB.doc(path).set(data); }).catch(function () { dbState = "slow"; render(); });
}
function isOn(pid) {
  var d = checks[state.person + "_" + viewKey() + "_" + state.session];
  return !!(d && d.steps && d.steps.indexOf(pid) >= 0);
}
function toggleStep(pid) {
  if (!canAct()) return;
  var date = viewKey(), id = state.person + "_" + date + "_" + state.session;
  var doc = checks[id] ? JSON.parse(JSON.stringify(checks[id])) : { person: state.person, date: date, session: state.session, steps: [] };
  var i = doc.steps.indexOf(pid);
  if (i >= 0) doc.steps.splice(i, 1); else doc.steps.push(pid);
  checks[id] = doc;
  reindex();
  save("checks/" + id, doc);
}
function markEmpty(pid) {
  if (!canAct()) return;
  var b = getBottle(state.person, pid), today = todayKey();
  // The last squeeze counts: marking a bottle empty also checks it off for this session.
  if (!isOn(pid) && PEOPLE[state.person][state.session].some(function (st) { return st.id === pid; })) toggleStep(pid);
  var nb = { person: state.person, pid: pid, startedOn: b.startedOn, status: "empty", emptiedOn: today,
             cycles: b.cycles.concat([{ startedOn: b.startedOn, emptiedOn: today, uses: usesOf(state.person, pid) }]) };
  bottles[state.person + "_" + pid] = nb;
  save("bottles/" + state.person + "_" + pid, nb);
}
function startNew(pid) {
  if (!canAct()) return;
  var b = getBottle(state.person, pid);
  var nb = { person: state.person, pid: pid, startedOn: todayKey(), status: "active", cycles: b.cycles };
  bottles[state.person + "_" + pid] = nb;
  save("bottles/" + state.person + "_" + pid, nb);
}

// ---- Usage math ----
function productsOf(p) {
  var seen = {}, out = [];
  p.am.concat(p.pm).forEach(function (s) { if (!seen[s.id]) { seen[s.id] = 1; out.push(s); } });
  return out;
}
function statsOf(person, s, today) {
  var b = getBottle(person, s.id), uses = usesOf(person, s.id);
  var end = b.status === "empty" ? b.emptiedOn : today;
  var days = Math.max(1, daysBetween(b.startedOn, end) + 1);
  var perDay = s.sessions.length;
  if (days >= 7 && uses > 0) perDay = uses / days;
  var avg = null;
  if (b.cycles.length) avg = b.cycles.reduce(function (a, c) { return a + c.uses; }, 0) / b.cycles.length;
  var daysLeft = null, estKey = null;
  if (b.status !== "empty" && avg !== null) {
    daysLeft = Math.ceil(Math.max(0, avg - uses) / perDay);
    estKey = toKey(toUtc(today) + daysLeft * DAY);
  }
  return { b: b, uses: uses, days: days, avg: avg, daysLeft: daysLeft, estKey: estKey };
}

// ---- Views ----
function thumb(img, cap) {
  if (!img) return '<div class="thumb none" aria-hidden="true">' + SUN + '</div>';
  return '<button class="thumb" data-img="' + img + '" data-cap="' + cap + '" aria-label="View photo of ' + cap + '"><img src="' + img + '" alt="" loading="lazy"></button>';
}
function capOf(s) { return s.name + (s.brand ? ", " + s.brand : ""); }

function notice() {
  if (dbState === "offline") return '<div class="notice">Not connected, so check-offs and usage are not being saved.</div>';
  if (dbState === "slow") return '<div class="notice">Saved data has not loaded yet, so counts may be out of date.</div>';
  if (!canWrite) return '<div class="notice">You have view-only access, so check-offs and Empty are turned off.</div>';
  return "";
}

function emptyControls(s) {
  var b = getBottle(state.person, s.id), dis = canAct() ? "" : " disabled";
  if (b.status === "empty") return '<button class="mini" data-new="' + s.id + '"' + dis + '>Started new</button>';
  if (state.confirm === s.id) {
    return '<span class="tag">Mark empty?</span><button class="mini warn" data-empty-yes="' + s.id + '"' + dis + '>Yes, empty</button><button class="mini" data-empty-no="1">Cancel</button>';
  }
  return '<button class="mini" data-empty="' + s.id + '"' + dis + '>Empty</button>';
}
function metaLine(s) {
  var b = getBottle(state.person, s.id), uses = usesOf(state.person, s.id);
  var left = b.status === "empty"
    ? '<span class="tag">Empty since ' + fmtKey(b.emptiedOn) + '</span>'
    : '<span class="mono">Used ' + uses + (uses === 1 ? " time" : " times") + ' since ' + fmtKey(b.startedOn) + '</span>';
  return '<div class="meta">' + left + '<span class="acts">' + emptyControls(s) + '</span></div>';
}

function stepRows(list, interactive) {
  return list.map(function (s, i) {
    var inner = '<span class="n">' + (i + 1) + '</span><span><span class="name">' + s.name + '</span>' + (s.brand ? '<span class="brand">' + s.brand + '</span>' : '') + '</span>';
    if (!interactive) return '<li class="row">' + thumb(s.img, capOf(s)) + '<div class="step">' + inner + '</div></li>';
    var empty = getBottle(state.person, s.id).status === "empty";
    return '<li class="pc"><div class="row">' + thumb(s.img, capOf(s)) + '<div class="card">' +
      '<button class="step' + (empty ? ' out' : '') + '" data-step="' + s.id + '" aria-pressed="' + isOn(s.id) + '">' + inner + '<span class="box">' + CHECK + '</span></button>' +
      metaLine(s) + '</div></div></li>';
  }).join("");
}

// Mask check-off for a day lives in its own doc: checks/<person>_<date>_mask with steps ["mask"].
function maskDocId(person, date) { return person + "_" + date + "_mask"; }
function isMaskOn(person, date) { var d = checks[maskDocId(person, date)]; return !!(d && d.steps && d.steps.indexOf("mask") >= 0); }
function toggleMask() {
  if (!canAct()) return;
  var date = viewKey(), id = maskDocId(state.person, date);
  var doc = { person: state.person, date: date, session: "mask", steps: isMaskOn(state.person, date) ? [] : ["mask"] };
  checks[id] = doc; save("checks/" + id, doc);
}
function maskReminder(t) {
  var m = maskFor(t.utc + DAY);
  if (!m) return "";
  return '<div class="banner remind"><div class="txt"><span class="label">Reminder</span><strong>Mask day tomorrow</strong><span class="note">' + m.name + ', ' + m.brand + '.' + (m.alt ? ' Out of it? Use ' + m.alt.name + '.' : '') + '</span></div><div class="thumbs">' + thumb(m.img, capOf(m)) + '</div></div>';
}
function maskBanner(t) {
  var m = maskFor(t.utc);
  if (m) {
    var on = isMaskOn(state.person, viewKey());
    return '<div class="banner' + (on ? ' done' : '') + '"><div class="txt"><span class="label">Mask day</span><strong>' + m.name + '</strong><span class="note">' + m.brand + '. Use it in addition to the usual steps.</span>' + (m.alt ? '<span class="note">Out of it? Use ' + m.alt.name + '.</span>' : '') + '</div><div class="thumbs">' + thumb(m.img, capOf(m)) + (m.alt ? thumb(m.alt.img, capOf(m.alt)) : '') + '</div>' +
      '<button class="maskcheck" data-mask="1" aria-pressed="' + on + '"' + (canAct() ? '' : ' disabled') + '><span class="box">' + CHECK + '</span>' + 'Mask done</button></div>';
  }
  var nx = nextMask(t.utc);
  return '<div class="banner quiet"><div class="txt"><span class="label">No mask today</span><span><strong>Next: ' + fmt(nx.utc, { weekday: "short", month: "short", day: "numeric" }) + '</strong> <span class="note">' + nx.mask.name + ', ' + rel(nx.utc, t.utc).toLowerCase() + '</span></span></div>' + thumb(nx.mask.img, capOf(nx.mask)) + '</div>';
}

function viewToday() {
  var t = nowParts(), p = PEOPLE[state.person], list = p[state.session];
  var past = !!state.date && state.date !== todayKey();
  if (past) t = { utc: toUtc(state.date) };
  var done = list.filter(function (s) { return isOn(s.id); }).length;
  var html = '<div class="stack">';
  var key = viewKey(), future = key > todayKey();
  html += '<div><span class="label">' + fmt(t.utc, { weekday: "long" }) + (past ? (future ? ' · upcoming day' : ' · earlier day') : '') + '</span>' +
    '<h1 class="datepick"><button class="datebtn" data-pick-date="1" aria-label="Choose another day">' + fmt(t.utc, { month: "long", day: "numeric" }) + '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>' +
    '<input type="date" id="daypick" value="' + key + '" min="' + SEED + '" aria-label="Day to show" tabindex="-1"></h1>' +
    (past ? '<div class="btnrow"><button class="mini" data-today="1">Back to today</button><span class="note">Changes here are saved to ' + fmtKey(state.date) + '.</span></div>' : '') + '</div>';
  html += notice();
  var sessionRow = '<div class="session" role="group" aria-label="Time of day">' +
    '<button id="s-am" data-s="am" aria-pressed="' + (state.session === "am") + '">' + SUN + 'Morning</button>' +
    '<button id="s-pm" data-s="pm" aria-pressed="' + (state.session === "pm") + '">' + MOON + 'Evening</button></div>';
  if (isComplete()) {
    var md = !!maskFor(t.utc), mOn = md && isMaskOn(state.person, viewKey());
    var face = '<img class="doneicon" src="img/icon-512.png" alt="' + (state.session === "am" ? "Morning" : "Evening") + ' routine complete">';
    if (md && !mOn) face += MASK_OVERLAY;
    html += '<div class="donewrap">' + (md
      ? '<button class="facebtn" data-mask="1" aria-pressed="' + mOn + '" aria-label="' + (mOn ? 'Mask done' : 'Tap her face when the mask is done') + '"' + (canAct() ? '' : ' disabled') + '>' + face + '</button>'
      : face) + '</div>';
    if (md && !mOn) html += '<p class="note center">Mask day: tap her face when the mask is done.</p>';
    if (md) html += maskBanner(t);
    if (state.session === "pm") html += maskReminder(t);
    html += sessionRow;
    html += '<div class="btnrow center"><span class="note">' + (state.session === "am" ? "Morning" : "Evening") + ' routine complete.</span><button class="mini" data-undone="1"' + (canAct() ? '' : ' disabled') + '>Show steps</button></div>';
    return html + '</div>';
  }
  html += maskBanner(t);
  html += sessionRow;
  html += '<div class="progress"><div class="bar"><i style="width:' + Math.round(done / list.length * 100) + '%"></i></div><span class="mono">' + done + '/' + list.length + '</span></div>';
  html += '<ol class="steps">' + stepRows(list, true) + '</ol>';
  html += '<button class="complete" data-complete="1"' + (canAct() ? '' : ' disabled') + '>' + CHECK + 'Complete</button>';
  if (state.session === "pm" && done === list.length) html += maskReminder(t);
  if (p.labeled) html += '<p class="note">Step numbers match the handwritten labels on the bottles.</p>';
  return html + '</div>';
}
function isComplete() {
  var d = checks[state.person + "_" + viewKey() + "_" + state.session];
  return !!(d && d.complete);
}
function setComplete(on) {
  if (!canAct()) return;
  var date = viewKey(), id = state.person + "_" + date + "_" + state.session;
  var doc = checks[id] ? JSON.parse(JSON.stringify(checks[id])) : { person: state.person, date: date, session: state.session, steps: [] };
  if (on) PEOPLE[state.person][state.session].forEach(function (st) {
    if (doc.steps.indexOf(st.id) < 0) doc.steps.push(st.id);

function catchUp(form) {
  var who = form.who.value, from = form.from.value, to = form.to.value, fromAt = form.fromAt.value, toAt = form.toAt.value, today = todayKey();
  if (!from || !to || from > to || to > today) { catchMsg = "Pick a range of past dates, earliest first."; return; }
  var people = who === "both" ? ["jonathan", "wife"] : [who], n = 0;
  for (var u = toUtc(from); u <= toUtc(to); u += DAY) {
    var k = toKey(u);
    ["am", "pm"].forEach(function (sess) {
      if (k === from && fromAt === "pm" && sess === "am") return;
      if (k === to && toAt === "am" && sess === "pm") return;
      people.forEach(function (person) {
        var id = person + "_" + k + "_" + sess, doc = checks[id] ? JSON.parse(JSON.stringify(checks[id])) : { person: person, date: k, session: sess, steps: [] };
        var before = doc.steps.length;
        PEOPLE[person][sess].forEach(function (st) { if (doc.steps.indexOf(st.id) < 0) doc.steps.push(st.id); });
        if (doc.steps.length !== before) { checks[id] = doc; save("checks/" + id, doc); n++; }

  }
  for (var u2 = toUtc(from); u2 <= toUtc(to); u2 += DAY) {

      checks[id2] = d2; save("checks/" + id2, d2); n++;

        return { key: t.key, name: t.name || "Trip", start: t.start, end: t.end, leaveAt: half(dep) || "am", retAt: half(arr) || "pm", dep: dep, arr: arr };
      });
    ttCount = (data.trips || []).length;
    if (!ttTrips.length) ttMsg = "No upcoming trips found in Travel Tracker (" + ttCount + " trips in the file, none with dates on or after today).";
    ttBusy = false; render();
  }).catch(function (e) { ttBusy = false; ttTrips = null; ttMsg = e && e.message ? e.message : String(e); render(); });
}
function ttPicker() {
  var h = '<div class="field"><label>Or pick an upcoming trip from Travel Tracker</label>';
  if (ttBusy) h += '<p class="note">Loading trips from Google Drive…</p>';
  else if (ttTrips && ttTrips.length) {
    h += '<div class="trips">' + ttTrips.map(function (t, i) {
      return '<button type="button" class="tripcard" data-tt="' + i + '"><span><strong>' + t.name + '</strong><span class="note">' + fmtKey(t.start) + ' ' + t.leaveAt.toUpperCase() + ' to ' + fmtKey(t.end) + ' ' + t.retAt.toUpperCase() + (t.dep ? '' : ' · no flight times, AM/PM guessed') + '</span></span><span class="note">Use</span></button>';
    }).join("") + '</div><div class="btnrow"><button type="button" class="mini" data-tt-load="1">Reload trips</button><span class="note">' + ttCount + ' trips in the file, ' + ttTrips.length + ' upcoming</span></div>';
  } else h += '<div class="btnrow"><button type="button" class="pdfbtn alt" data-tt-load="1">Load trips from Travel Tracker</button></div>';
  if (ttMsg) h += '<p class="err">' + ttMsg + '</p>';
  return h + '</div>';
}
function useTtTrip(i) {
  var t = ttTrips && ttTrips[i], f = document.getElementById("tripform");
  if (!t || !f) return;
  f.leave.value = t.start; f.ret.value = t.end;
  f.querySelector('[name=leaveAt][value=' + t.leaveAt + ']').checked = true;
  f.querySelector('[name=retAt][value=' + t.retAt + ']').checked = true;
  f.dataset.tripname = t.name;
  var n = document.getElementById("tripname"); if (n) n.value = t.name;
}

document.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.signin) signIn();
  else if (b.dataset.signout) signOut();
  else if (b.dataset.ttLoad) loadTravelTrackerTrips();
  else if (b.dataset.tt !== undefined) useTtTrip(+b.dataset.tt);
  else if (b.dataset.memberDel) removeMember(b.dataset.memberDel);
});
document.addEventListener("change", function (e) {
  if (e.target.id === "daypick" && e.target.value) { state.date = e.target.value === todayKey() ? null : e.target.value; render(); }
});
document.addEventListener("submit", function (e) {
  if (e.target.id === "memberform") { e.preventDefault(); addMember(e.target.email.value); e.target.reset(); }
});
var picked = false;

render();
startAuth();
</script>
</body>
